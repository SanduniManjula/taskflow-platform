plugin: amazon.aws.aws_ec2
regions:
  - ap-south-1
filters:
  instance-state-name: running
  "tag:AnsibleManaged": "true"
keyed_groups:
  - key: ec2_tags.Environment
    prefix: env
hostnames:
  - instance-id
compose:
  ansible_host: instance_id
  ansible_connection: "'aws_ssm'"
  ansible_aws_ssm_region: "'ap-south-1'"
  ansible_aws_ssm_bucket_name: "'taskflow-ansible-ssm-779219236644-ap-south-1'"
