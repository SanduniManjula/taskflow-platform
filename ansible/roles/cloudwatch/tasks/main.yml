---
- name: Install CloudWatch agent
  ansible.builtin.package:
    name: amazon-cloudwatch-agent
    state: present

- name: Ensure CloudWatch agent config directory exists
  ansible.builtin.file:
    path: /opt/taskflow
    state: directory
    mode: '0755'

- name: Install CloudWatch agent configuration
  ansible.builtin.copy:
    dest: /opt/taskflow/amazon-cloudwatch-agent.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "logs": {
          "logs_collected": {
            "files": {
              "collect_list": [
                {
                  "file_path": "/var/log/ecs/ecs-agent.log",
                  "log_group_name": "{{ taskflow_ec2_log_group | default('/ec2/taskflow-dev') }}",
                  "log_stream_name": "{instance_id}/ecs-agent"
                },
                {
                  "file_path": "/var/log/ecs/ecs-init.log",
                  "log_group_name": "{{ taskflow_ec2_log_group | default('/ec2/taskflow-dev') }}",
                  "log_stream_name": "{instance_id}/ecs-init"
                },
                {
                  "file_path": "/var/log/cloud-init-output.log",
                  "log_group_name": "{{ taskflow_ec2_log_group | default('/ec2/taskflow-dev') }}",
                  "log_stream_name": "{instance_id}/cloud-init-output"
                }
              ]
            }
          }
        }
      }
  notify: Restart CloudWatch agent

- name: Enable CloudWatch agent
  ansible.builtin.service:
    name: amazon-cloudwatch-agent
    state: started
    enabled: true
